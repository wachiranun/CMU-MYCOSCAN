# Stage 2: OpenFungi backbone -> CMU colony images. One model per modality.
# Replace the class list with the final 10 species/groups once confirmed.
run_name = "cmu_colony_densenet121_head"
manifest = "data/cmu/manifest.csv"
source = "cmu"
modality = "colony"
arch = "densenet121"
weights = "runs/openfungi_densenet121/model.pt"
finetune = "head"
split = "kfold"
n_folds = 5
epochs = 15
lr = 1e-3
classes = [
  "Aspergillus_fumigatus", "Aspergillus_flavus", "Aspergillus_niger", "Aspergillus_terreus",
  "Fusarium_spp", "Mucorales", "Talaromyces_marneffei", "Sporothrix_schenckii_complex",
  "Penicillium_spp", "Scedosporium_spp",
]

# Synthetic stand-in for stage 2 (microscopic). Results say nothing about real fungi.
run_name = "syn_cmu_microscopic_head"
manifest = "data/synthetic/manifest.csv"
output_dir = "runs/synthetic"
source = "cmu"
modality = "microscopic"
weights = "runs/synthetic/syn_openfungi/model.pt"
finetune = "head"
split = "kfold"
n_folds = 5
image_size = 112
epochs = 4
batch_size = 16
lr = 1e-3
bootstrap = 200
